services:
  postgres:
    image: postgres:15-alpine
    container_name: app_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    image: YOUR_DOCKERHUB_USERNAME/express-prisma-crud:latest
    container_name: app_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword@postgres:5432/mydb?schema=public
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata: