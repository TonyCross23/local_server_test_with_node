name: CI/CD Pipeline

on:
  push:
    branches:
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment based on Branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "HOST=${{ secrets.UAT_HOST }}" >> $GITHUB_ENV
            echo "USER=${{ secrets.UAT_USER }}" >> $GITHUB_ENV
            echo "SSH_PASSWORD=${{ secrets.UAT_SSH_PASSWORD }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "HOST=${{ secrets.PROD_HOST }}" >> $GITHUB_ENV
            echo "USER=${{ secrets.PROD_USER }}" >> $GITHUB_ENV
            echo "SSH_PASSWORD=${{ secrets.PROD_SSH_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/express-prisma-crud:latest

      - name: Copy docker-compose.yml to Remote Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          password: ${{ env.SSH_PASSWORD }}
          source: "docker-compose.yml"
          target: "/opt/app"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            cd /opt/app
            sudo docker compose pull
            sudo docker compose up -d --force-recreate